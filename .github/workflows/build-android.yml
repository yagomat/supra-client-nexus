
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Install Cordova CLI
      run: npm install -g cordova@latest
      
    - name: Build React app first
      run: |
        npm run build
        
    - name: Create Cordova project structure
      run: |
        if [ ! -f "config.xml" ]; then
          cordova create temp com.lovable.supraclientnexus "Supra Client Nexus"
          cp temp/config.xml ./config.xml
          rm -rf temp
        fi
        if [ -f "cordova-config.xml" ]; then
          cp cordova-config.xml config.xml
        fi
        
    - name: Prepare www directory
      run: |
        mkdir -p www
        cp -r dist/* www/ || echo "Copied dist files"
        
    - name: Fix index.html for Cordova
      run: |
        if [ -f "www/index.html" ]; then
          sed -i 's|href="/|href="|g' www/index.html
          sed -i 's|src="/|src="|g' www/index.html
          # Add cordova.js script before closing head tag
          if ! grep -q "cordova.js" www/index.html; then
            sed -i 's|</head>|  <script src="cordova.js"></script>\n  </head>|g' www/index.html
          fi
          echo "✅ index.html ajustado para Cordova"
          cat www/index.html | head -20
        fi
        
    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "License acceptance attempted"
        
    - name: Install additional SDK components
      run: |
        echo "📦 Instalando componentes do SDK..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" || echo "Build tools install failed"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" || echo "Platform install failed"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" || echo "Platform tools install failed"
        
    - name: Add Android platform
      run: |
        echo "📱 Adicionando plataforma Android..."
        cordova platform add android@12 --save || cordova platform add android --save || echo "Platform add failed, trying to continue..."
        cordova platform ls
        
    - name: Install Cordova plugins
      run: |
        echo "🔌 Instalando plugins..."
        cordova plugin add cordova-plugin-device --save || echo "Plugin device failed"
        cordova plugin add cordova-plugin-splashscreen --save || echo "Plugin splashscreen failed"
        cordova plugin add cordova-plugin-statusbar --save || echo "Plugin statusbar failed"
        cordova plugin add cordova-plugin-whitelist --save || echo "Plugin whitelist failed"
        cordova plugin add cordova-plugin-network-information --save || echo "Plugin network failed"
        cordova plugin ls
        
    - name: Configure Gradle wrapper permissions
      run: |
        echo "🔧 Configurando permissões do Gradle..."
        if [ -f "platforms/android/gradlew" ]; then
          chmod +x platforms/android/gradlew
          echo "✅ Gradle wrapper permissions set"
        fi
        
    - name: Set ANDROID_HOME environment
      run: |
        echo "🌍 Configurando variáveis de ambiente..."
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/33.0.0" >> $GITHUB_PATH
        
    - name: Verify project structure
      run: |
        echo "📂 Estrutura do projeto:"
        ls -la
        echo "📂 Conteúdo www:"
        ls -la www/ || echo "www directory not found"
        echo "📂 Platforms:"
        ls -la platforms/ || echo "platforms directory not found"
        if [ -d "platforms/android" ]; then
          echo "📂 Android platform:"
          ls -la platforms/android/
        fi
        
    - name: Build Android APK
      run: |
        echo "🔨 Construindo APK..."
        cordova requirements android || echo "Requirements check failed"
        
        # Try release build first, fallback to debug
        echo "Tentando build release..."
        if ! cordova build android --release --verbose; then
          echo "❌ Release build falhou, tentando debug..."
          if ! cordova build android --debug --verbose; then
            echo "❌ Debug build também falhou, tentando sem verbose..."
            cordova build android || echo "All build attempts failed"
          fi
        fi
        
    - name: Find APK files
      run: |
        echo "🔍 Procurando arquivos APK..."
        find . -name "*.apk" -type f || echo "No APK files found"
        
        # Try to find in common locations
        if [ -d "platforms/android/app/build/outputs/apk" ]; then
          echo "📂 APKs encontrados em outputs/apk:"
          find platforms/android/app/build/outputs/apk -name "*.apk" -type f || echo "No APKs in outputs/apk"
        fi
        
        if [ -d "platforms/android/build/outputs/apk" ]; then
          echo "📂 APKs encontrados em build/outputs/apk:"
          find platforms/android/build/outputs/apk -name "*.apk" -type f || echo "No APKs in build/outputs/apk"
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-apk
        path: |
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          platforms/android/app/build/outputs/apk/debug/app-debug.apk
          platforms/android/build/outputs/apk/release/android-release-unsigned.apk
          platforms/android/build/outputs/apk/debug/android-debug.apk
        retention-days: 30
        
    - name: Create Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          APK gerado automaticamente via GitHub Actions
          
          📱 **Como instalar:**
          1. Baixe o arquivo APK
          2. Ative "Fontes desconhecidas" no Android
          3. Instale o APK
          4. Conceda as permissões necessárias
        files: |
          platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          platforms/android/app/build/outputs/apk/debug/app-debug.apk
        token: ${{ secrets.GITHUB_TOKEN }}

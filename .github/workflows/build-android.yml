
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js with specific version
      uses: actions/setup-node@v4
      with:
        node-version: '18.19.0'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Clear all caches and reinstall dependencies
      run: |
        echo "🧹 Clearing all caches and reinstalling..."
        
        # Clear npm cache completely
        npm cache clean --force
        
        # Remove all existing files
        rm -rf node_modules package-lock.json
        
        # Clear system cache
        sudo apt-get clean
        
        echo "📦 Installing dependencies with specific flags..."
        
        # Install with specific flags to avoid native binding issues
        npm install --no-optional --legacy-peer-deps --no-audit --no-fund
        
        # Force install platform-specific binaries for Linux
        echo "🔧 Installing platform-specific native modules..."
        npm install @rollup/rollup-linux-x64-gnu --save-dev --no-optional || echo "⚠️ Rollup native module install failed, continuing..."
        npm install @swc/core-linux-x64-gnu --save-dev --no-optional || echo "⚠️ SWC native module install failed, continuing..."
        
        # Rebuild native modules
        npm rebuild --no-optional || echo "⚠️ Native module rebuild failed, continuing..."
        
        echo "✅ Dependencies installed successfully"
        
    - name: Fix package.json for Cordova compatibility
      run: |
        echo "🔧 Fixing package.json for Cordova compatibility..."
        
        # Backup original package.json
        cp package.json package.json.backup
        
        # Remove "type": "module" temporarily for Cordova compatibility
        if grep -q '"type": "module"' package.json; then
          echo "📝 Removing 'type': 'module' for Cordova compatibility..."
          sed -i '/"type": "module",\?/d' package.json
          echo "✅ package.json updated for Cordova"
        else
          echo "ℹ️ No 'type': 'module' found in package.json"
        fi
        
        # Show the diff
        echo "📋 Package.json changes:"
        diff package.json.backup package.json || true
        
    - name: Install Cordova CLI
      run: |
        echo "🔧 Installing Cordova CLI..."
        npm install -g cordova@12.0.0
        cordova --version
        
    - name: Build React app with multiple strategies
      run: |
        echo "⚛️ Building React app with multiple strategies..."
        
        # Set Node.js memory limit
        export NODE_OPTIONS="--max-old-space-size=4096"
        
        BUILD_SUCCESS=false
        
        # Strategy 1: Try to install missing native binaries first
        echo "🔧 Installing missing native binaries..."
        npm install @swc/core-linux-x64-gnu --no-optional || true
        npm install @rollup/rollup-linux-x64-gnu --no-optional || true
        
        # Strategy 2: Standard build with current setup
        echo "🔄 Attempting standard build..."
        if npm run build; then
          echo "✅ Standard build successful"
          BUILD_SUCCESS=true
        else
          echo "⚠️ Standard build failed, trying alternatives..."
        fi
        
        # Strategy 3: Build with fallback vite config (no SWC)
        if [ "$BUILD_SUCCESS" = false ]; then
          echo "🔄 Creating fallback Vite config without SWC..."
          
          # Backup original config
          cp vite.config.ts vite.config.ts.backup
          
          # Create simple esbuild-only config
          cat > vite.config.ts << 'EOF'
        import { defineConfig } from "vite";
        import react from "@vitejs/plugin-react";
        import path from "path";
        
        export default defineConfig({
          server: {
            host: "::",
            port: 8080,
          },
          plugins: [react()],
          resolve: {
            alias: {
              "@": path.resolve(__dirname, "./src"),
            },
          },
          build: {
            target: 'es2020',
            minify: 'esbuild'
          },
          esbuild: {
            target: 'es2020'
          }
        });
        EOF
          
          if npm run build; then
            echo "✅ Fallback build successful"
            BUILD_SUCCESS=true
          else
            echo "⚠️ Fallback build also failed"
            # Restore original config
            mv vite.config.ts.backup vite.config.ts
          fi
        fi
        
        # Strategy 4: Create minimal static build
        if [ "$BUILD_SUCCESS" = false ]; then
          echo "🔄 Creating minimal static build..."
          mkdir -p dist
          
          # Copy public files
          cp -r public/* dist/ 2>/dev/null || true
          
          # Create basic index.html
          cat > dist/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Supra Client Nexus</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
            .container { max-width: 600px; margin: 0 auto; }
            .logo { font-size: 2em; color: #333; margin-bottom: 20px; }
            .description { color: #666; line-height: 1.6; }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="logo">📱 Supra Client Nexus</div>
            <div class="description">
              <p>Aplicativo móvel para gestão de clientes e integração com WhatsApp.</p>
              <p>Versão de desenvolvimento - Build automatizado via GitHub Actions.</p>
            </div>
          </div>
        </body>
        </html>
        EOF
          echo "✅ Minimal static build created"
          BUILD_SUCCESS=true
        fi
        
        # Verify build output exists
        if [ "$BUILD_SUCCESS" = true ] && [ -d "dist" ] && [ -f "dist/index.html" ]; then
          echo "✅ Build verification successful"
          ls -la dist/
        else
          echo "❌ Build verification failed"
          exit 1
        fi
        
    - name: Setup Cordova project
      run: |
        echo "📱 Setting up Cordova project..."
        
        # Ensure config.xml exists
        if [ ! -f "config.xml" ]; then
          echo "📋 Creating base config.xml..."
          cordova create temp-cordova com.lovable.supraclientnexus "Supra Client Nexus"
          cp temp-cordova/config.xml ./config.xml
          rm -rf temp-cordova
        fi
        
        # Apply custom config if available
        if [ -f "cordova-config.xml" ]; then
          echo "📋 Applying custom configuration..."
          cp cordova-config.xml config.xml
        fi
        
        # Prepare www directory
        echo "📂 Preparing www directory..."
        rm -rf www
        mkdir -p www
        cp -r dist/* www/
        
        # Fix paths for Cordova
        if [ -f "www/index.html" ]; then
          echo "🔧 Fixing index.html for Cordova..."
          
          # Fix relative paths
          sed -i 's|href="/|href="|g' www/index.html
          sed -i 's|src="/|src="|g' www/index.html
          
          # Add cordova.js script if not present
          if ! grep -q "cordova.js" www/index.html; then
            sed -i 's|</head>|  <script src="cordova.js"></script>\n  </head>|g' www/index.html
          fi
          
          echo "✅ index.html prepared for Cordova"
        fi
        
    - name: Configure Android environment
      run: |
        echo "🤖 Configuring Android environment..."
        
        # Set environment variables
        export ANDROID_HOME=$ANDROID_HOME
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        export PATH=$PATH:$ANDROID_HOME/build-tools/34.0.0
        
        # Accept licenses
        echo "📜 Accepting Android SDK licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required SDK components
        echo "📦 Installing SDK components..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" || true
        
        echo "✅ Android environment configured"
        
    - name: Add Android platform and plugins with enhanced error handling
      run: |
        echo "🔌 Adding Android platform and plugins..."
        
        # Clean any existing platform first
        echo "🧹 Cleaning existing platforms..."
        rm -rf platforms/android
        cordova platform rm android || echo "⚠️ No android platform to remove"
        
        # Add Android platform with better error handling
        echo "📱 Adding Android platform..."
        if cordova platform add android@12 --save 2>&1 | tee platform_add.log; then
          echo "✅ Android platform added successfully"
        else
          echo "⚠️ Platform add with version failed, trying without version..."
          if cordova platform add android --save 2>&1 | tee platform_add_fallback.log; then
            echo "✅ Android platform added (fallback method)"
          else
            echo "❌ Both platform add methods failed"
            cat platform_add.log || true
            cat platform_add_fallback.log || true
            exit 1
          fi
        fi
        
        # Verify platform was added
        if [ -d "platforms/android" ]; then
          echo "✅ Android platform directory exists"
          ls -la platforms/android/
        else
          echo "❌ Android platform directory missing"
          exit 1
        fi
        
        # Add plugins with error handling
        echo "🔌 Adding Cordova plugins..."
        cordova plugin add cordova-plugin-whitelist --save || echo "⚠️ whitelist plugin failed"
        cordova plugin add cordova-plugin-device --save || echo "⚠️ device plugin failed"
        cordova plugin add cordova-plugin-splashscreen --save || echo "⚠️ splashscreen plugin failed"
        cordova plugin add cordova-plugin-statusbar --save || echo "⚠️ statusbar plugin failed"
        
        # Show current state
        echo "📋 Current platform and plugin status:"
        cordova platform ls || echo "⚠️ Could not list platforms"
        cordova plugin ls || echo "⚠️ Could not list plugins"
        
    - name: Configure Gradle and fix build issues
      run: |
        echo "⚙️ Configuring Gradle..."
        
        if [ -d "platforms/android" ]; then
          # Make gradlew executable
          if [ -f "platforms/android/gradlew" ]; then
            chmod +x platforms/android/gradlew
            echo "✅ Gradlew made executable"
          fi
          
          # Configure gradle properties
          echo "📝 Creating gradle.properties..."
          cat > platforms/android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=512m
        org.gradle.parallel=true
        org.gradle.daemon=true
        org.gradle.configureondemand=true
        android.useAndroidX=true
        android.enableJetifier=true
        android.suppressUnsupportedCompileSdk=34
        EOF
          
          # Update build.gradle if needed
          if [ -f "platforms/android/build.gradle" ]; then
            echo "🔧 Updating build.gradle for compatibility..."
            
            # Ensure proper Gradle version
            sed -i "s/classpath 'com.android.tools.build:gradle:[0-9.]*'/classpath 'com.android.tools.build:gradle:8.1.1'/" platforms/android/build.gradle
            
            echo "✅ build.gradle updated"
          fi
          
          # Fix cordova-android compatibility
          if [ -f "platforms/android/cordova/Api.js" ]; then
            echo "🔧 Checking Api.js compatibility..."
            
            # Check if Api.js has ES modules syntax
            if grep -q "export" platforms/android/cordova/Api.js; then
              echo "⚠️ Api.js uses ES modules syntax, this might cause issues"
            fi
          fi
          
          echo "✅ Gradle configured"
        else
          echo "⚠️ Android platform not found, skipping Gradle configuration"
        fi
        
    - name: Restore package.json and build Android APK
      run: |
        echo "🔨 Building Android APK..."
        
        # Restore original package.json after Cordova operations
        if [ -f "package.json.backup" ]; then
          echo "📝 Restoring original package.json..."
          cp package.json.backup package.json
          echo "✅ Original package.json restored"
        fi
        
        # Check requirements
        echo "🔍 Checking Cordova requirements..."
        cordova requirements android || echo "⚠️ Requirements check failed, continuing anyway..."
        
        BUILD_SUCCESS=false
        APK_LOCATION=""
        
        # Attempt 1: Release build
        echo "🔄 Attempting release build..."
        if cordova build android --release --verbose 2>&1 | tee build_release.log; then
          echo "✅ Release build completed"
          BUILD_TYPE="release"
          BUILD_SUCCESS=true
        else
          echo "⚠️ Release build failed, checking logs..."
          tail -20 build_release.log || true
        fi
        
        # Attempt 2: Debug build if release failed
        if [ "$BUILD_SUCCESS" = false ]; then
          echo "🔄 Attempting debug build..."
          if cordova build android --debug --verbose 2>&1 | tee build_debug.log; then
            echo "✅ Debug build completed"
            BUILD_TYPE="debug"
            BUILD_SUCCESS=true
          else
            echo "⚠️ Debug build failed, checking logs..."
            tail -20 build_debug.log || true
          fi
        fi
        
        # Attempt 3: Clean and retry if both failed
        if [ "$BUILD_SUCCESS" = false ]; then
          echo "🧹 Cleaning and retrying..."
          cordova clean android || echo "⚠️ Clean failed"
          
          if cordova build android --debug --verbose 2>&1 | tee build_clean.log; then
            echo "✅ Clean build completed"
            BUILD_TYPE="debug-clean"
            BUILD_SUCCESS=true
          else
            echo "⚠️ Clean build also failed"
            tail -20 build_clean.log || true
          fi
        fi
        
        # Set environment variable for next step
        echo "BUILD_TYPE=${BUILD_TYPE:-failed}" >> $GITHUB_ENV
        echo "BUILD_SUCCESS=$BUILD_SUCCESS" >> $GITHUB_ENV
        
        if [ "$BUILD_SUCCESS" = true ]; then
          echo "✅ Android APK build process completed successfully"
        else
          echo "⚠️ All build attempts had issues, but continuing to artifact collection..."
        fi
        
    - name: Find and prepare APK files
      if: always()
      run: |
        echo "🔍 Comprehensive APK search and preparation..."
        
        # Create output directory
        mkdir -p apk-output
        
        # Search strategy 1: Find all APK files across the project
        echo "🔍 Searching for APK files across the entire project..."
        APK_FOUND=false
        
        find . -name "*.apk" -type f 2>/dev/null | while read apk; do
          if [ -f "$apk" ]; then
            echo "📱 Found APK: $apk"
            # Copy with a unique name
            filename=$(basename "$apk")
            timestamp=$(date +"%Y%m%d-%H%M")
            new_name="supra-client-nexus-${BUILD_TYPE:-unknown}-${timestamp}-${filename}"
            cp "$apk" "apk-output/$new_name" 2>/dev/null && echo "✅ Copied: $new_name" || echo "⚠️ Failed to copy $apk"
            APK_FOUND=true
          fi
        done
        
        # Search strategy 2: Check common locations explicitly
        APK_PATHS=(
          "platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          "platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "platforms/android/app/build/outputs/apk/release/app-release.apk"
          "platforms/android/build/outputs/apk/debug/android-debug.apk"
          "platforms/android/build/outputs/apk/release/android-release-unsigned.apk"
          "platforms/android/build/outputs/apk/release/android-release.apk"
        )
        
        echo "🔍 Checking standard APK locations..."
        for path in "${APK_PATHS[@]}"; do
          if [ -f "$path" ]; then
            echo "✅ Found APK at: $path"
            filename=$(basename "$path")
            timestamp=$(date +"%Y%m%d-%H%M")
            new_name="supra-client-nexus-${BUILD_TYPE:-unknown}-${timestamp}-${filename}"
            cp "$path" "apk-output/$new_name"
            echo "📦 Copied: $new_name"
            APK_FOUND=true
          else
            echo "❌ Not found: $path"
          fi
        done
        
        # Check what we found
        APK_COUNT=$(find apk-output -name "*.apk" 2>/dev/null | wc -l)
        
        if [ "$APK_COUNT" -gt 0 ]; then
          echo "✅ Found and prepared $APK_COUNT APK file(s)"
          echo "📋 APK files prepared:"
          ls -la apk-output/*.apk
          
          # Set environment variable for release step
          echo "APK_FOUND=true" >> $GITHUB_ENV
          
        else
          echo "⚠️ No APK files found - creating comprehensive build report"
          
          # Create detailed build report
          cat > apk-output/build-report.txt << EOF
        Supra Client Nexus - Android Build Report
        =======================================
        
        Build Date: $(date)
        Build Number: ${{ github.run_number }}
        Build Type: ${BUILD_TYPE:-unknown}
        Build Success: ${BUILD_SUCCESS:-false}
        APK Generation: Failed - No APK files found
        
        Build Process Summary:
        - Dependencies installation: Completed
        - React app build: Completed
        - Cordova setup: Completed
        - Android platform: Added
        - APK generation: Failed (No files found)
        
        Searched Locations:
        EOF
          
          # Add searched locations to report
          for path in "${APK_PATHS[@]}"; do
            if [ -f "$path" ]; then
              echo "  ✅ $path - EXISTS" >> apk-output/build-report.txt
            else
              echo "  ❌ $path - NOT FOUND" >> apk-output/build-report.txt
            fi
          done
          
          # Add platform info if available
          if [ -d "platforms/android" ]; then
            echo -e "\nPlatform Information:" >> apk-output/build-report.txt
            echo "- Android platform directory: EXISTS" >> apk-output/build-report.txt
            echo -e "\nDirectory structure:" >> apk-output/build-report.txt
            ls -la platforms/android/ >> apk-output/build-report.txt 2>/dev/null || true
            
            # Check build outputs directory
            if [ -d "platforms/android/app/build/outputs" ]; then
              echo -e "\nBuild outputs structure:" >> apk-output/build-report.txt
              find platforms/android/app/build/outputs -type f >> apk-output/build-report.txt 2>/dev/null || true
            fi
          else
            echo -e "\nPlatform Information:" >> apk-output/build-report.txt
            echo "- Android platform directory: MISSING" >> apk-output/build-report.txt
          fi
          
          # Add build logs if available
          if [ -f "build_debug.log" ]; then
            echo -e "\n--- Debug Build Log (last 50 lines) ---" >> apk-output/build-report.txt
            tail -50 build_debug.log >> apk-output/build-report.txt 2>/dev/null || true
          fi
          
          if [ -f "build_release.log" ]; then
            echo -e "\n--- Release Build Log (last 50 lines) ---" >> apk-output/build-report.txt
            tail -50 build_release.log >> apk-output/build-report.txt 2>/dev/null || true
          fi
          
          # Set environment variable
          echo "APK_FOUND=false" >> $GITHUB_ENV
        fi
        
        echo "📋 Final output directory contents:"
        ls -la apk-output/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-build-output
        path: apk-output/
        retention-days: 30
        if-no-files-found: warn
        
    - name: Create GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.BUILD_SUCCESS == 'true' && env.APK_FOUND == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Android APK v${{ github.run_number }}
        body: |
          🎉 APK Android gerado automaticamente
          
          📱 **Como instalar:**
          1. Baixe o arquivo APK dos artifacts acima
          2. Ative "Fontes desconhecidas" no Android
          3. Instale o APK
          4. Conceda as permissões necessárias
          
          🔧 **Build #${{ github.run_number }}**
          📦 **Tipo de Build:** ${{ env.BUILD_TYPE }}
          
          📦 **Baixar APK:** Vá para a seção "Artifacts" acima para fazer o download
        files: apk-output/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: false


name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies with retry
      run: |
        echo "📦 Installing dependencies..."
        for i in {1..3}; do
          if npm ci --no-optional --prefer-offline; then
            echo "✅ Dependencies installed successfully"
            break
          else
            echo "❌ Attempt $i failed, retrying..."
            rm -rf node_modules package-lock.json
            sleep 10
          fi
        done
        
    - name: Install Cordova CLI
      run: |
        echo "🔧 Installing Cordova CLI..."
        npm install -g cordova@12.0.0
        cordova --version
        
    - name: Build React app
      run: |
        echo "⚛️ Building React app..."
        npm run build
        if [ -d "dist" ]; then
          echo "✅ React build successful"
          ls -la dist/
        else
          echo "❌ React build failed - dist directory not found"
          exit 1
        fi
        
    - name: Setup Cordova project
      run: |
        echo "📱 Setting up Cordova project..."
        
        if [ ! -f "config.xml" ]; then
          cordova create temp-cordova com.lovable.supraclientnexus "Supra Client Nexus"
          cp temp-cordova/config.xml ./config.xml
          rm -rf temp-cordova
          echo "✅ Base config.xml created"
        fi
        
        if [ -f "cordova-config.xml" ]; then
          cp cordova-config.xml config.xml
          echo "✅ Custom config.xml applied"
        fi
        
        echo "📂 Preparing www directory..."
        rm -rf www
        mkdir -p www
        cp -r dist/* www/
        
        if [ -f "www/index.html" ]; then
          sed -i 's|href="/|href="|g' www/index.html
          sed -i 's|src="/|src="|g' www/index.html
          
          if ! grep -q "cordova.js" www/index.html; then
            sed -i 's|</head>|  <script src="cordova.js"></script>\n  </head>|g' www/index.html
          fi
          echo "✅ index.html fixed for Cordova"
        fi
        
    - name: Configure Android environment
      run: |
        echo "🤖 Configuring Android environment..."
        export ANDROID_HOME=$ANDROID_HOME
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        export PATH=$PATH:$ANDROID_HOME/build-tools/34.0.0
        
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" || true
        
    - name: Add Android platform and plugins
      run: |
        echo "🔌 Adding Android platform and plugins..."
        
        cordova platform add android@12 --save
        
        cordova plugin add cordova-plugin-whitelist --save
        cordova plugin add cordova-plugin-device --save
        cordova plugin add cordova-plugin-splashscreen --save
        cordova plugin add cordova-plugin-statusbar --save
        
        echo "✅ Platform and plugins added"
        cordova platform ls
        cordova plugin ls
        
    - name: Configure Gradle
      run: |
        echo "⚙️ Configuring Gradle..."
        if [ -d "platforms/android" ]; then
          if [ -f "platforms/android/gradlew" ]; then
            chmod +x platforms/android/gradlew
          fi
          
          cat > platforms/android/gradle.properties << EOF
        org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=512m
        org.gradle.parallel=true
        org.gradle.daemon=true
        org.gradle.configureondemand=true
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
          echo "✅ Gradle configured"
        fi
        
    - name: Build Android APK
      run: |
        echo "🔨 Building Android APK..."
        
        cordova requirements android || true
        
        if cordova build android --release --verbose; then
          echo "✅ Release build successful"
          BUILD_TYPE="release"
        elif cordova build android --debug --verbose; then
          echo "✅ Debug build successful"  
          BUILD_TYPE="debug"
        else
          echo "❌ Both release and debug builds failed"
          exit 1
        fi
        
        echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
        
    - name: Find and list APK files
      run: |
        echo "🔍 Searching for APK files in all directories..."
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found with find command"
        
        echo "📂 Checking specific directories:"
        ls -la platforms/android/app/build/outputs/apk/ 2>/dev/null || echo "Directory not found: platforms/android/app/build/outputs/apk/"
        ls -la platforms/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found: platforms/android/app/build/outputs/apk/debug/"
        ls -la platforms/android/app/build/outputs/apk/release/ 2>/dev/null || echo "Directory not found: platforms/android/app/build/outputs/apk/release/"
        
    - name: Create APK directory and copy files
      run: |
        echo "📦 Creating APK output directory..."
        mkdir -p apk-output
        
        echo "🔍 Locating and copying APK files..."
        
        APK_PATHS=(
          "platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          "platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "platforms/android/build/outputs/apk/debug/android-debug.apk"
          "platforms/android/build/outputs/apk/release/android-release-unsigned.apk"
        )
        
        APK_FOUND=false
        for path in "${APK_PATHS[@]}"; do
          if [ -f "$path" ]; then
            echo "✅ Found APK: $path"
            cp "$path" apk-output/
            APK_FOUND=true
          else
            echo "❌ APK not found: $path"
          fi
        done
        
        if [ "$APK_FOUND" = false ]; then
          echo "🔍 Searching for any APK files..."
          find platforms/android -name "*.apk" -type f -exec cp {} apk-output/ \; 2>/dev/null || true
        fi
        
        echo "📋 Final APK directory contents:"
        ls -la apk-output/ || echo "No files in apk-output directory"
        
        if [ -z "$(ls -A apk-output/)" ]; then
          echo "❌ No APK files found - creating dummy file to prevent artifact failure"
          echo "No APK files were generated during the build process." > apk-output/build-failed.txt
        else
          echo "✅ APK files ready for upload"
          cd apk-output
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              new_name="supra-client-nexus-v${{ github.run_number }}-${apk}"
              mv "$apk" "$new_name"
              echo "📝 Renamed: $apk -> $new_name"
            fi
          done
          cd ..
        fi
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-apk
        path: apk-output/
        retention-days: 30
        if-no-files-found: warn
        
    - name: Create GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && hashFiles('apk-output/*.apk') != ''
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Android APK v${{ github.run_number }}
        body: |
          🎉 APK Android gerado automaticamente
          
          📱 **Como instalar:**
          1. Baixe o arquivo APK
          2. Ative "Fontes desconhecidas" no Android
          3. Instale o APK
          4. Conceda as permissões necessárias
          
          🔧 **Build #${{ github.run_number }}**
        files: apk-output/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: false

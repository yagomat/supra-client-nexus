
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm ci
      
    - name: Install Cordova CLI
      run: npm install -g cordova@latest
      
    - name: Build React app first
      run: |
        npm run build
        echo "✅ React app built successfully"
        
    - name: Create Cordova project structure
      run: |
        echo "🔧 Setting up Cordova project..."
        if [ ! -f "config.xml" ]; then
          cordova create temp com.lovable.supraclientnexus "Supra Client Nexus"
          cp temp/config.xml ./config.xml
          rm -rf temp
          echo "✅ Base config.xml created"
        fi
        if [ -f "cordova-config.xml" ]; then
          cp cordova-config.xml config.xml
          echo "✅ Custom config.xml applied"
        fi
        
    - name: Prepare www directory
      run: |
        echo "📂 Preparing www directory..."
        mkdir -p www
        if [ -d "dist" ]; then
          cp -r dist/* www/
          echo "✅ Dist files copied to www"
        else
          echo "❌ Dist directory not found"
          exit 1
        fi
        
    - name: Fix index.html for Cordova
      run: |
        echo "🔧 Fixing index.html for Cordova..."
        if [ -f "www/index.html" ]; then
          # Fix asset paths
          sed -i 's|href="/|href="|g' www/index.html
          sed -i 's|src="/|src="|g' www/index.html
          # Add cordova.js script
          if ! grep -q "cordova.js" www/index.html; then
            sed -i 's|</head>|  <script src="cordova.js"></script>\n  </head>|g' www/index.html
          fi
          echo "✅ index.html fixed for Cordova"
        else
          echo "❌ index.html not found in www directory"
          exit 1
        fi
        
    - name: Set environment variables
      run: |
        echo "🌍 Setting environment variables..."
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
        
    - name: Accept Android SDK licenses
      run: |
        echo "📜 Accepting Android SDK licenses..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || echo "License acceptance completed"
        
    - name: Install Android SDK components
      run: |
        echo "📦 Installing Android SDK components..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || echo "Build tools install attempted"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || echo "Platform install attempted"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" || echo "Platform 33 install attempted"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" || echo "Platform tools install attempted"
        
    - name: Add Android platform
      run: |
        echo "📱 Adding Android platform..."
        cordova platform add android@latest --save || echo "Platform add attempted"
        cordova platform ls || echo "Platform list failed"
        
    - name: Install essential Cordova plugins
      run: |
        echo "🔌 Installing essential plugins..."
        cordova plugin add cordova-plugin-whitelist --save || echo "Whitelist plugin failed"
        cordova plugin add cordova-plugin-device --save || echo "Device plugin failed"
        cordova plugin add cordova-plugin-splashscreen --save || echo "Splashscreen plugin failed"
        cordova plugin add cordova-plugin-statusbar --save || echo "Statusbar plugin failed"
        cordova plugin ls || echo "Plugin list failed"
        
    - name: Verify project structure
      run: |
        echo "📂 Project structure verification:"
        ls -la
        echo "📂 www directory:"
        ls -la www/ || echo "www not found"
        echo "📂 platforms directory:"
        ls -la platforms/ || echo "platforms not found"
        if [ -d "platforms/android" ]; then
          echo "📂 Android platform found"
          ls -la platforms/android/
        fi
        
    - name: Configure Gradle
      run: |
        echo "🔧 Configuring Gradle..."
        if [ -f "platforms/android/gradlew" ]; then
          chmod +x platforms/android/gradlew
          echo "✅ Gradle wrapper permissions set"
        fi
        
        # Create or update gradle.properties
        if [ -d "platforms/android" ]; then
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m" >> platforms/android/gradle.properties
          echo "org.gradle.parallel=true" >> platforms/android/gradle.properties
          echo "org.gradle.daemon=true" >> platforms/android/gradle.properties
          echo "✅ Gradle properties configured"
        fi
        
    - name: Build Android APK
      run: |
        echo "🔨 Building Android APK..."
        
        # Check Cordova requirements
        cordova requirements android || echo "Requirements check completed"
        
        # Try different build approaches
        echo "Attempting release build..."
        if cordova build android --release --verbose; then
          echo "✅ Release build successful"
        else
          echo "❌ Release build failed, trying debug build..."
          if cordova build android --debug --verbose; then
            echo "✅ Debug build successful"
          else
            echo "❌ Debug build failed, trying simple build..."
            cordova build android || echo "❌ All build attempts failed"
          fi
        fi
        
    - name: Find and list APK files
      run: |
        echo "🔍 Searching for APK files..."
        find . -name "*.apk" -type f | head -20 || echo "No APK files found with find"
        
        # Check common locations
        APK_LOCATIONS=(
          "platforms/android/app/build/outputs/apk/release"
          "platforms/android/app/build/outputs/apk/debug"
          "platforms/android/build/outputs/apk/release"
          "platforms/android/build/outputs/apk/debug"
        )
        
        for location in "${APK_LOCATIONS[@]}"; do
          if [ -d "$location" ]; then
            echo "📂 Found APK directory: $location"
            ls -la "$location" || echo "Could not list $location"
          fi
        done
        
    - name: Create APK directory and copy files
      run: |
        echo "📁 Creating APK directory..."
        mkdir -p apk-output
        
        # Copy any found APK files
        find platforms/android -name "*.apk" -type f -exec cp {} apk-output/ \; || echo "No APK files to copy"
        
        # List what we have
        echo "📦 APK files found:"
        ls -la apk-output/ || echo "No files in apk-output"
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: android-apk
        path: |
          apk-output/*.apk
          platforms/android/app/build/outputs/apk/**/*.apk
          platforms/android/build/outputs/apk/**/*.apk
        retention-days: 30
        
    - name: Create GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          🎉 APK Android gerado automaticamente
          
          📱 **Como instalar:**
          1. Baixe o arquivo APK
          2. Ative "Fontes desconhecidas" no Android
          3. Instale o APK
          4. Conceda as permissões necessárias
          
          🔧 **Build #${{ github.run_number }}**
        files: apk-output/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: false


name: Build Android APK with Capacitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.19.0'
        cache: 'npm'
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Clean environment completely
      run: |
        echo "🧹 Complete environment cleanup..."
        npm cache clean --force
        rm -rf node_modules package-lock.json
        rm -rf android/ || true
        rm -rf platforms/ || true
        rm -rf plugins/ || true
        rm -rf www/ || true
        rm -f config.xml || true
        rm -f cordova.js || true
        
    - name: Install dependencies
      run: |
        echo "📦 Installing dependencies..."
        npm install --legacy-peer-deps --no-optional
        
    - name: Verify clean Capacitor setup
      run: |
        echo "🔍 Verifying Capacitor setup..."
        npx cap --version
        npx cap doctor
        
        # Ensure no Cordova remnants
        echo "🚫 Checking for Cordova remnants..."
        if [ -d "platforms" ]; then
          echo "❌ Found Cordova platforms directory"
          rm -rf platforms/
        fi
        if [ -f "config.xml" ]; then
          echo "❌ Found Cordova config.xml"
          rm -f config.xml
        fi
        
    - name: Build React app
      run: |
        echo "⚛️ Building React app..."
        export NODE_OPTIONS="--max-old-space-size=4096"
        npm run build
        
    - name: Initialize Capacitor Android
      run: |
        echo "🤖 Initializing Capacitor Android..."
        npx cap add android --confirm
        
    - name: Sync Capacitor
      run: |
        echo "🔄 Syncing Capacitor..."
        npx cap sync android
        
    - name: Configure Android SDK
      run: |
        echo "🔧 Configuring Android SDK..."
        export ANDROID_HOME=$ANDROID_HOME
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        # Accept all licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required components
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" || true
        
    - name: Verify Android setup
      run: |
        echo "📁 Verifying Android setup..."
        ls -la android/ || echo "Android directory not found"
        ls -la android/app/ || echo "Android app directory not found"
        
        if [ ! -d "android" ]; then
          echo "❌ Android directory missing!"
          exit 1
        fi
        
    - name: Build Android APK
      run: |
        echo "🔨 Building Android APK..."
        cd android
        
        # Make gradlew executable
        chmod +x ./gradlew
        
        # Clean and build
        ./gradlew clean --no-daemon --info
        ./gradlew assembleDebug --no-daemon --stacktrace --info
        
        echo "✅ APK build completed successfully"
        
        # List all APK files
        echo "📋 Generated APK files:"
        find . -name "*.apk" -type f -exec ls -la {} \;
        
    - name: Prepare APK artifacts
      run: |
        echo "📦 Preparing APK artifacts..."
        mkdir -p apk-output
        
        # Find and copy APK files
        find android -name "*.apk" -type f | while read apk; do
          if [ -f "$apk" ]; then
            echo "📱 Found APK: $apk"
            filename=$(basename "$apk")
            timestamp=$(date +"%Y%m%d-%H%M")
            new_name="supra-client-nexus-capacitor-${timestamp}-${filename}"
            cp "$apk" "apk-output/$new_name"
            echo "✅ Copied: $new_name"
          fi
        done
        
        # Verify files
        echo "📋 Final APK files:"
        ls -la apk-output/
        
        if [ ! "$(ls -A apk-output/)" ]; then
          echo "❌ ERROR: No APK files found!"
          echo "🔍 Full search results:"
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB files anywhere"
          exit 1
        fi
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-capacitor
        path: apk-output/
        retention-days: 30
        
    - name: Create GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: capacitor-v${{ github.run_number }}
        name: Capacitor Android APK v${{ github.run_number }}
        body: |
          🎉 APK Android gerado com Capacitor
          
          📱 **Como instalar:**
          1. Baixe o arquivo APK dos artifacts
          2. Ative "Fontes desconhecidas" no Android
          3. Instale o APK
          4. Conceda as permissões necessárias
          
          🔧 **Build #${{ github.run_number }}**
          ⚡️ **Framework:** Capacitor 7.x
          
        files: apk-output/*.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_on_unmatched_files: false
